[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multigcn"
version = "0.1.0"
description = "GCN graph-autoencoder ensemble for gene regulatory network inference"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nirwan Tandukar" }]
keywords = ["gene regulatory network", "graph neural network", "bioinformatics"]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "joblib>=1.2",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Python-runtime algorithms that can share MultiGCN's interpreter.
#
# arboreto is deliberately NOT here. It requires dask+distributed and calls
# LocalCluster(diagnostics_port=...), removed from modern distributed; pinning
# back to dask 2023 pulls numpy<2 (numpy.compat), which conflicts with the
# numpy 2.x torch needs. GENIE3/GRNBOOST2 are implemented natively on
# scikit-learn instead - same algorithm, no dependency conflict.
inference = ["inferelator>=0.6"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
multigcn = "multigcn.cli:main"

[tool.setuptools.packages.find]
include = ["multigcn*"]

[tool.setuptools.package-data]
multigcn = ["inference/scripts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
